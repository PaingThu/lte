<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatternSpeak : Detail</title>
    <link rel="stylesheet" href="/assets/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        li {
            list-style-type: none;
        }
    </style>
</head>

<body class="min-h-screen bg-primary">

    {{> header }}
    <main class="relative flex flex-col md:flex-row bg-white" id="mainContainer">
        <div class="fixed w-full md:w-1/7">{{> sidenav }}</div>
        <div class="ml-0 md:ml-[14.2857143%] content-container w-full h-full md:w-6/7 bg-white shadow-xl border border-slate-200">
            
            <div id="patternDetail" class="content p-6 border border-slate-200 bg-white">
                <div class="breadcrumbs">
                    <a href="/admin/english-pattern/" class="text-blue-500 hover:underline">Patterns</a>
                    <span class="mx-2">/</span>
                    <span>{{patternDetail.title}}</span>
                </div>

                <div id="displayArea" class="space-y-4 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar"></div>
                <div id="patternDetailContainer"></div>
            </div>
        </div>
    </main>

    <!-- Overlay & Sheet -->
    <div id="modalOverlay"
        class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[80] transition-opacity duration-300 opacity-0">
    </div>

    <script type="module">
        import { loadingSpinner, getBasePath, tokenCheck, configLink } from "/assets/js/config.js";
        import { api } from "/assets/js/api.js";
        const init = async () => {
            displayArea.innerHTML = loadingSpinner('Data Loading .....');
            const isAuthenticated = await tokenCheck('detail');
            if (!isAuthenticated) {
                window.location.href = getBasePath() + "admin/login/";
            }else{
                const urlParams = new URLSearchParams(window.location.search);
                const patternId = urlParams.get('id');
                if (!patternId) {
                    window.location.href = getBasePath() + "admin/english-pattern/";
                }
                const result = await api.getPatternDetail(patternId);
                displayArea.innerHTML = ''; // Clear loading spinner
                const patternDetailContainer = document.getElementById('patternDetailContainer');
                if (result.status === 'ng') {
                    patternDetailContainer.innerHTML = `<p class="text-red-500">${result.message}</p>`;
                }else{
                    const patternDetail = result.data;
                    let examplesHTML = '';
                    if (patternDetail.examples && patternDetail.examples.length > 0) {
                        patternDetail.examples.forEach((example, index) => {
                            examplesHTML += `<div class="flex p-3 border-b border-slate-300"><strong>${index + 1}:</strong>`;
                            examplesHTML += `<ul class="list-disc pl-5">
                                <li>${example.en}</li>
                                <li>${example.ja}</li>
                                <li>${example.my}</li>
                            </ul></div>`;
                        });
                    } else {
                        examplesHTML = '<p>No examples available.</p>';
                    }
                    patternDetailContainer.innerHTML = `
                        <h2 class="text-xl font-bold mb-4">${patternDetail.title}</h2>
                        <p><strong>Level:</strong> ${patternDetail.level}</p>
                        <p><strong>Formula:</strong> ${patternDetail.formula}</p>
                        <p><strong>Explanation (EN):</strong> ${patternDetail.explanation.en}</p>
                        <p><strong>Explanation (JA):</strong> ${patternDetail.explanation.ja}</p>
                        <p><strong>Explanation (MY):</strong> ${patternDetail.explanation.my}</p>
                        <div class="mt-4">
                            <h3 class="font-semibold">Examples:</h3>
                            ${examplesHTML}
                        </div>
                    `;
                }
                
            }
        };
        init();
        configLink();
    </script>
</body>

</html>
